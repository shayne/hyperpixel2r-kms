name: Publish driver release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable semantic release tag, for example v0.1.0-rc.1
        required: true
        type: string
      source_ref:
        description: Source branch, tag, or commit to release
        default: main
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Prove release workflow exists at dispatch ref
        env:
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$DISPATCH_COMMIT"
          git cat-file -e "$DISPATCH_COMMIT^{commit}"
          git cat-file -e "$DISPATCH_COMMIT:.github/workflows/release.yml"

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install release packaging tools
        run: sudo apt-get update && sudo apt-get install --yes zstd

      - name: Confirm unused tag and bind selected source
        id: preflight
        env:
          TAG: ${{ inputs.tag }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          git diff --quiet
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "release tag already exists: $TAG" >&2
            exit 1
          fi
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          test "$source_commit" = "$DISPATCH_COMMIT"
          ./scripts/validate-release-tag.sh "$TAG" "$source_commit"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Download commit-bound verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          runs="$RUNNER_TEMP/verified-runs.json"
          gh run list --workflow ci.yml --commit "$RELEASE_COMMIT" --status success \
            --limit 20 --json databaseId,headSha,conclusion > "$runs"
          run_id="$(jq -r --arg commit "$RELEASE_COMMIT" \
            '[.[] | select(.headSha == $commit and .conclusion == "success")] | last | .databaseId // empty' \
            "$runs")"
          test -n "$run_id" || { echo "no successful verification run for $RELEASE_COMMIT" >&2; exit 1; }
          mkdir -p dist/release
          gh run download "$run_id" \
            --name "release-assets-$RELEASE_COMMIT" \
            --dir dist/release
          jq -e --arg commit "$RELEASE_COMMIT" \
            '.source.commit == $commit' \
            dist/release/driver-manifest.json >/dev/null

      - name: Validate release metadata and checksums
        run: |
          mise run validate-release-metadata -- dist/release/driver-manifest.json dist/release/SBOM.spdx.json
          (
            cd dist/release
            sha256sum -c SHA256SUMS
          )

      - name: Create the immutable tag after verification
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "release tag appeared while the source was being verified: $TAG" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$RELEASE_COMMIT" --message "HyperPixel 2 Round KMS driver $TAG"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_commit="$(git rev-parse "$TAG^{}")"
          test "$tag_commit" = "$RELEASE_COMMIT"
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Attest every published release subject
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/release/SHA256SUMS

      - name: Attest the SPDX bill of materials
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/release/hyperpixel2r-kms-source.tar.zst
          sbom-path: dist/release/SBOM.spdx.json

      - name: Create a draft prerelease with immutable assets
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ steps.tag.outputs.commit }}
          name: HyperPixel 2 Round KMS driver ${{ inputs.tag }}
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/release/*

      - name: Publish the verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease --title "HyperPixel 2 Round KMS driver $TAG"
