name: Verify driver

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install release packaging tools
        run: sudo apt-get update && sudo apt-get install --yes zstd

      - name: Build pinned kernel tool image for lifecycle fixtures
        run: docker build --tag hyperpixel2r-kms-kernel-builder:debian-trixie-gcc14 --file packaging/Dockerfile.kernel .

      - name: Run complete host verification
        run: mise run verify

      - name: Prove two clean source-only packages are byte-for-byte equal
        run: |
          mise run package-release -- --source-revision "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/no-artifacts" --output "$RUNNER_TEMP/release-one"
          mise run package-release -- --source-revision "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/no-artifacts" --output "$RUNNER_TEMP/release-two"
          diff -r "$RUNNER_TEMP/release-one" "$RUNNER_TEMP/release-two"
          (
            cd "$RUNNER_TEMP/release-one"
            sha256sum -c SHA256SUMS
          )
          mise run validate-release-metadata -- \
            "$RUNNER_TEMP/release-one/driver-manifest.json" \
            "$RUNNER_TEMP/release-one/SBOM.spdx.json"
