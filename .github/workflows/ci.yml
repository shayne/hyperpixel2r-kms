name: Verify driver

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  validate-release-metadata:
    name: Validate official release metadata on supported Python hosts (${{ matrix.os }} / Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the hosted Python version
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install source-package compression
        run: |
          if test "${{ runner.os }}" = Linux; then
            sudo apt-get update
            sudo apt-get install --yes zstd
          else
            brew install zstd
          fi

      - name: Package and validate release metadata with the official tools
        run: |
          python3 --version
          output="$RUNNER_TEMP/release-metadata"
          mise run package-release -- --source-revision "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/no-artifacts" --output "$output"
          mise run validate-release-metadata -- "$output/driver-manifest.json" "$output/SBOM.spdx.json"

  verify-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install release packaging tools
        run: sudo apt-get update && sudo apt-get install --yes zstd

      - name: Build pinned kernel tool image
        run: docker build --tag hyperpixel2r-kms-kernel-builder:debian-trixie-gcc14 --file packaging/Dockerfile.kernel .

      - name: Run non-lifecycle verification once
        run: mise run verify-fast

  lifecycle-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Build pinned kernel tool image
        run: docker build --tag hyperpixel2r-kms-kernel-builder:debian-trixie-gcc14 --file packaging/Dockerfile.kernel .

      - name: Run release lifecycle smoke test
        env:
          HP2R_FIXTURE_CASE: smoke
        run: mise run test-boot-scripts

  lifecycle-deep:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: Deep lifecycle fixture (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        case:
          - core
          - inactive-uninstall-backlight
          - prior-absent-uninstall-proof
          - inactive-kernel-recovery-phases
          - inactive-kernel-finalization-interruptions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Build pinned kernel tool image
        run: docker build --tag hyperpixel2r-kms-kernel-builder:debian-trixie-gcc14 --file packaging/Dockerfile.kernel .

      - name: Run exhaustive lifecycle fixture shard
        env:
          HP2R_FIXTURE_CASE: ${{ matrix.case }}
        run: mise run test-boot-scripts

  package:
    needs: [validate-release-metadata, verify-fast, lifecycle-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install release packaging tools
        run: sudo apt-get update && sudo apt-get install --yes zstd

      - name: Prove two clean source-only packages are byte-for-byte equal
        run: |
          mise run package-release -- --source-revision "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/no-artifacts" --output "$RUNNER_TEMP/release-one"
          mise run package-release -- --source-revision "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/no-artifacts" --output "$RUNNER_TEMP/release-two"
          diff -r "$RUNNER_TEMP/release-one" "$RUNNER_TEMP/release-two"
          (cd "$RUNNER_TEMP/release-one" && sha256sum -c SHA256SUMS)
          mise run validate-release-metadata -- "$RUNNER_TEMP/release-one/driver-manifest.json" "$RUNNER_TEMP/release-one/SBOM.spdx.json"

      - name: Upload the commit-bound verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/release-one
          if-no-files-found: error
          retention-days: 30
