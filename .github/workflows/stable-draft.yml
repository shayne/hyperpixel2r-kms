name: Create unpublished stable driver draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Canonical stable tag, for example v0.1.0
        required: true
        type: string
      source_ref:
        description: Exact source branch to draft from
        default: main
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected stable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Prove stable workflow exists at dispatch ref
        env:
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$DISPATCH_COMMIT"
          git cat-file -e "$DISPATCH_COMMIT^{commit}"
          git cat-file -e "$DISPATCH_COMMIT:.github/workflows/stable-draft.yml"

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Confirm absent stable tag and bind selected source
        id: preflight
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          test "$GITHUB_REPOSITORY" = shayne/hyperpixel2r-kms
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_REF" = main
          git diff --quiet
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "stable tag already exists: $TAG" >&2
            exit 1
          fi
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          test "$source_commit" = "$DISPATCH_COMMIT"
          ./scripts/validate-stable-release-tag.sh "$TAG" "$source_commit"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Download commit-bound verified stable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          runs="$RUNNER_TEMP/verified-runs.json"
          gh run list --workflow ci.yml --commit "$RELEASE_COMMIT" --status success \
            --limit 20 --json databaseId,headSha,conclusion > "$runs"
          run_id="$(jq -r --arg commit "$RELEASE_COMMIT" \
            '[.[] | select(.headSha == $commit and .conclusion == "success")] | last | .databaseId // empty' \
            "$runs")"
          test -n "$run_id" || { echo "no successful verification run for $RELEASE_COMMIT" >&2; exit 1; }
          mkdir -p dist/stable
          gh run download "$run_id" \
            --name "release-assets-$RELEASE_COMMIT" \
            --dir dist/stable
          jq -e --arg commit "$RELEASE_COMMIT" \
            '.source.commit == $commit' \
            dist/stable/driver-manifest.json >/dev/null

      - name: Validate stable metadata and checksums
        run: |
          mise run validate-release-metadata -- dist/stable/driver-manifest.json dist/stable/SBOM.spdx.json
          (
            cd dist/stable
            sha256sum -c SHA256SUMS
          )

      - name: Attest every stable draft subject
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/stable/SHA256SUMS

      - name: Attest the stable SPDX bill of materials
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/stable/hyperpixel2r-kms-source.tar.zst
          sbom-path: dist/stable/SBOM.spdx.json

      - name: Create unpublished stable draft without a tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          record="$RUNNER_TEMP/stable-draft-record.json"
          python3 scripts/stable_release.py draft \
            --tag "$TAG" \
            --commit "$RELEASE_COMMIT" \
            --assets dist/stable \
            --record "$record"
          HP2R_STABLE_DRAFT_RELEASE_ID="$(jq -r .release_id "$record")"
          HP2R_STABLE_DRAFT_ASSET_FINGERPRINT="$(jq -r .asset_fingerprint "$record")"
          {
            printf 'Stable draft release ID: `%s`\n\n' "$HP2R_STABLE_DRAFT_RELEASE_ID"
            printf 'Stable draft asset fingerprint: `%s`\n' "$HP2R_STABLE_DRAFT_ASSET_FINGERPRINT"
          } >> "$GITHUB_STEP_SUMMARY"
