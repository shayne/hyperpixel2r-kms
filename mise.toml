min_version = "2026.7.7"

[env]
_.file = { path = ".env", redact = true }
CC = "/usr/bin/clang"

[tasks.test-protocol]
run = """
mkdir -p target
cc -std=c11 -Wall -Wextra -Werror -pedantic \
  kernel/hyperpixel2r_kms_protocol.c tests/protocol_test.c \
  -o target/protocol-test
./target/protocol-test
"""

[tasks.test-gpio]
run = """
mkdir -p target
cc -std=c11 -Wall -Wextra -Werror -pedantic \
  kernel/hyperpixel2r_kms_gpio.c tests/gpio_test.c \
  -o target/gpio-test
./target/gpio-test
"""

[tasks.test-build-contract]
run = "bash tests/build-contract.sh"

[tasks.test-boot-scripts]
run = "bash tests/boot-scripts.sh"

[tasks.export-target-kbuild]
run = """
HP2R_TARGET="${HP2R_TARGET:-${PLANERADAR_PI_TARGET:-}}" \
  exec ./scripts/export-target-kbuild.sh
"""

[tasks.build-driver]
run = """
HP2R_TARGET="${HP2R_TARGET:-${PLANERADAR_PI_TARGET:-}}" \
  exec ./scripts/build-driver.sh
"""

[tasks.check-artifacts]
run = """
HP2R_TARGET="${HP2R_TARGET:-${PLANERADAR_PI_TARGET:-}}" \
  exec ./scripts/check-artifacts.sh
"""

[tasks.stage-tryboot]
run = """
HP2R_TARGET="${HP2R_TARGET:-}" \
  exec ./scripts/stage-tryboot.sh "$@"
"""

[tasks.verify-boot]
run = """
HP2R_TARGET="${HP2R_TARGET:-}" \
  exec ./scripts/verify-boot.sh "$@"
"""

[tasks.commit-boot]
run = """
HP2R_TARGET="${HP2R_TARGET:-}" \
  exec ./scripts/commit-boot.sh "$@"
"""

[tasks.rollback-boot]
run = """
HP2R_TARGET="${HP2R_TARGET:-}" \
  exec ./scripts/rollback-boot.sh "$@"
"""

[tasks.uninstall]
run = """
HP2R_TARGET="${HP2R_TARGET:-}" \
  exec ./scripts/uninstall.sh "$@"
"""

[tasks.verify]
depends = ["test-protocol", "test-gpio", "test-build-contract", "test-boot-scripts"]
